name: Bug report
description: Something blazon does is wrong
labels: ['bug']
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `blazon --version`, or the commit if you run from source.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command you ran and the smallest token or page file that shows it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
