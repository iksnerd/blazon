name: CI
# Runs on version tags and by hand, and nothing else: every commit and push is checked locally by .githooks/pre-commit and
# .githooks/pre-push (see CONTRIBUTING.md). This run proves a release builds and tests from a clean clone. On a version
# tag, and only when the tests and the secret scan have passed, the last job attaches the package to a GitHub release.
# It does not publish to npm; the first publish is a decision still to be made (see CHANGELOG).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:py
      - run: npm run format:check
      - run: npm run build
      - run: npm run build -w mcp
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit the dependencies that ship or run
        run: |
          npm audit --omit=dev
          npm audit --omit=dev --workspace mcp
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm pack
      - uses: softprops/action-gh-release@v3
        with:
          files: '*.tgz'
          generate_release_notes: true
